name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The map builds first, so the service's build copies web/dist inside it (US-23 c4).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The integration tests need no database service here: Testcontainers builds the packaged
      # database from db/Dockerfile on the runner's own Docker.
      - run: dotnet build --configuration Release
      - run: dotnet run --project tests/Tessera.UnitTests --configuration Release --no-build
      - run: dotnet run --project tests/Tessera.IntegrationTests --configuration Release --no-build
      # The ETL's tests build a geodatabase with GDAL and run the pipeline on it (ADR 0009). Ubuntu's
      # own GDAL serves; without it the pipeline would pull GDAL's Docker image.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gdal-bin
      - run: dotnet run --project tests/Tessera.Etl.Tests --configuration Release --no-build
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:scripts
      # The browser tests drive Chrome against the built service and a database of their own
      # (scripts/e2e.ts). They use the Google Chrome the runner image ships with, through
      # CHROMIUM_PATH: downloading Playwright's own browser hung for ten minutes twice on
      # 14 October 2026. The screenshot comparisons stay out: the approved images come from
      # Playwright's own Chromium, and this Chrome draws text a few per cent differently. npm test
      # runs them on a machine with Playwright's browser. The time limit fails a stuck run in minutes.
      - run: npm run e2e -- --grep-invert "approved image"
        timeout-minutes: 20
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
