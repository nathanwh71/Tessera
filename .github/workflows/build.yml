# The automatic build on GitHub. It builds the map and the service and runs every test on a clean
# machine, so a change that works only on the maintainer's laptop fails here first (US-00 c1, c3).

name: build

# Each push to main, and each pull request before it merges, gets the same checks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # A fixed Ubuntu, not ubuntu-latest, so the runner changes only when this line does, and the
    # office machine runs Ubuntu 24.04 too (US-35).
    runs-on: ubuntu-24.04
    steps:
      # Fetches the repository onto the runner; every later step reads it.
      - uses: actions/checkout@v4
      # global.json names the .NET SDK, so the runner builds with the same SDK as the laptop.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Node.js 26 runs the .ts scripts directly by stripping their types (ADR 0002, package.json's
      # engines).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The map builds first, so the service's build copies web/dist inside it (US-23 c4). npm ci
      # installs exactly what package-lock.json names; --no-audit and --no-fund drop two reports
      # that change nothing and slow the step.
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The integration tests need no database service here: Testcontainers builds the packaged
      # database from db/Dockerfile on the runner's own Docker.
      # Release, as npm run build makes it: every later step runs this one build with --no-build,
      # rather than building again. Each test project is a program of its own (global.json picks
      # Microsoft.Testing.Platform), so dotnet run starts it and it runs its tests.
      - run: dotnet build --configuration Release
      # The borders between the service's layers first, since they fail in seconds (ADR 0010).
      - run: dotnet run --project tests/Tessera.ArchitectureTests --configuration Release --no-build
      - run: dotnet run --project tests/Tessera.UnitTests --configuration Release --no-build
      - run: dotnet run --project tests/Tessera.IntegrationTests --configuration Release --no-build
      # The scripts' own tools, then the scripts' checks: tsc refuses a type error before a run
      # meets it, and node --test runs the pure functions' tests (ADR 0002, rule 1).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:scripts
      # The pipeline in etl/, in Python: uv installs Python and the pipeline's packages. Some tests
      # read a source through ogr2ogr, GDAL's own tool, as the pipeline does for curves and a few
      # other cases, so Ubuntu's GDAL comes first. Then its types, its style, the rule that its pure
      # code reads no file (import-linter), and its tests.
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gdal-bin
      - run: uv run pyright
        working-directory: etl
      - run: uv run ruff check .
        working-directory: etl
      - run: uv run lint-imports
        working-directory: etl
      - run: uv run pytest -q
        working-directory: etl
      # The browser tests drive Chromium against the built service and a database of their own
      # (scripts/e2e.ts). Playwright runs inside its own Docker image, the one named after the
      # version web/package.json pins. Its Chromium and fonts draw the approved images of UI-17
      # within their tolerance on any machine, so the screenshot comparisons run here too. The
      # runner's own Google Chrome draws text a few per cent differently, and downloading
      # Playwright's browser alone can hang for ten minutes; the image comes from Microsoft's
      # registry. The time limit fails a stuck run.
      - run: npm run e2e
        timeout-minutes: 20
        env:
          TESSERA_PLAYWRIGHT_IN_DOCKER: "1"
