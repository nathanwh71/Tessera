name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The map builds first, so the service's build copies web/dist inside it (US-23 c4).
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The integration tests need no database service here: Testcontainers builds the packaged
      # database from db/Dockerfile on the runner's own Docker.
      - run: dotnet build --configuration Release
      - run: dotnet run --project tests/Tessera.UnitTests --configuration Release --no-build
      - run: dotnet run --project tests/Tessera.ArchitectureTests --configuration Release --no-build
      - run: dotnet run --project tests/Tessera.IntegrationTests --configuration Release --no-build
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:scripts
