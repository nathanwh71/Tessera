[project]
name = "tessera-etl"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyogrio>=0.13.0",
    "shapely>=2.2.0",
]

[project.scripts]
tessera-etl = "tessera_etl.shell.program:entry"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "import-linter>=2.15",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-geopandas>=1.1.4.20261006",
    "types-shapely>=2.1.0.20260728",
]
